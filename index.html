<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ed"><link rel="manifest" href="manifest.json?v=23"><link rel="icon" href="icon.svg?v=4" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg?v=4"><link rel="stylesheet" href="style.css?v=23"><title>개인연구</title></head><body><header><div><h1>개인연구</h1><p>봉사 · 연구 · 집회 준비를 한곳에</p></div><button id="installBtn" class="ghost" hidden>앱 설치</button></header><main><section class="toolbar"><input id="search" placeholder="제목, 성구, 키워드 검색"><button id="addBtn">＋ 새 자료</button></section><nav id="tabs"></nav><section id="subcats" class="chips"></section><section id="list" class="list"></section></main><dialog id="editor"><form id="form"><h2 id="formTitle">새 자료</h2><label>대주제<select id="category"></select></label><label>소제목<input id="subcategory" required placeholder="예: 성경 인물"></label><label>제목<input id="title" required></label><label>핵심 성구<input id="scripture" placeholder="예: 잠언 3:5, 6"></label><label>내용<textarea id="content" rows="7"></textarea></label><label>적용점<textarea id="application" rows="3"></textarea></label><label>키워드<input id="keywords" placeholder="쉼표로 구분"></label><label>자료 링크<input id="source" placeholder="https://www.jw.org/..."></label><div class="actions"><button type="button" id="cancel" class="ghost">취소</button><button type="submit">저장</button></div></form></dialog><script src="data.js?v=23"></script><script src="app.js?v=23"></script></body></html>
